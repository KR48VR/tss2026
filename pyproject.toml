[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onetx"
version = "0.1.0"
description = "A crosswalked O*NET: tasks, activities and skills linked to Singapore's SSOC and Skills Framework, joined with frontier-AI usage and capability signals, with a transparent disruption-timing model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "model2vec>=0.3",
  "rapidfuzz>=3.6",
  "pyyaml>=6",
  "tqdm>=4.66",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
onetx = "onetx.cli:main"

[tool.setuptools]
packages = ["onetx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
